bio: |
  Dr. Muhammad Ikram is a professor of strategy & sustainability at school of Business
  Administration, Al Akhawayn University in Ifrane, Morocco. He has been recongnized among
  the world top 2% scientists by Stanford University and is a Ceritified Management & Business
  Educator (CMBE) by the Chartered Association of Business Schools, UK. He holds a PhD in Management 
  Science and Engineering and previously served as a postdoctoral researcher at Shenzhen University
  Dr. Ikram has published more than 70 research articles in leading journals and has reviewed over 
  500+ aritcles of 200+ journals. His research focuses on sustainability, corporate social responsibility,
  environmental management, circular economy, sustainable development goals, decison support system, and 
  green supply chain management.

