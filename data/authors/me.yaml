bio: |
  Dr. Muhammad Ikram is a Professor of Strategy and Sustainability at the School of Business
  Administration, Al Akhawayn University in Ifrane, Morocco. He has been recognized among the
  world's top 2% of scientists by Stanford University and is a Certified Management and Business
  Educator (CMBE) of the Chartered Association of Business Schools, UK. He holds a PhD in
  Management Science and Engineering and previously served as a postdoctoral researcher at
  Shenzhen University. Dr. Ikram has published more than 70+ research articles in leading journals
  and has reviewed over 500 articles for more than 200 journals. His research focuses on
  sustainability, corporate social responsibility, environmental management, circular economy,
  sustainable development goals, decision support systems, and green supply chain management.
