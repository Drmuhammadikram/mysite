<div id="cw-root"></div>
<style>
#cw-btn{position:fixed;bottom:24px;right:24px;z-index:9998;display:flex;align-items:center;gap:9px;
 background:#0f6e56;border:none;border-radius:26px;padding:13px 20px;font-size:0.85rem;
 font-family:inherit;color:#fff;cursor:pointer;box-shadow:0 4px 18px rgba(15,110,86,0.34);
 transition:transform .2s,box-shadow .2s;}
#cw-btn:hover{transform:translateY(-2px);box-shadow:0 7px 24px rgba(15,110,86,0.44);}
#cw-panel{position:fixed;bottom:24px;right:24px;z-index:9999;width:400px;max-width:calc(100vw - 30px);
 background:var(--hb-color-background,#fff);border-radius:15px;
 box-shadow:0 20px 56px rgba(0,0,0,0.20);display:none;flex-direction:column;overflow:hidden;}
#cw-panel.open{display:flex;animation:cwin .2s ease-out;}
@keyframes cwin{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
#cw-head{background:#0f6e56;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;}
#cw-ico{width:31px;height:31px;border-radius:8px;background:rgba(255,255,255,0.17);
 display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#cw-log{padding:16px 18px;overflow-y:auto;max-height:50vh;min-height:130px;}
#cw-foot{display:flex;align-items:center;gap:10px;padding:12px 18px;
 border-top:1px solid rgba(128,128,128,0.16);}
#cw-in{flex:1;padding:7px 0;font-size:0.86rem;font-family:inherit;color:inherit;
 background:transparent;border:none;outline:none;}
#cw-in::placeholder{opacity:0.45;}
#cw-send{width:33px;height:33px;border:none;border-radius:8px;background:#0f6e56;color:#fff;
 cursor:pointer;font-size:0.95rem;flex-shrink:0;transition:background .15s;}
#cw-send:hover{background:#1baf7a;}
.cw-s{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-size:0.845rem;
 padding:11px 13px;margin-bottom:7px;border:none;border-radius:9px;color:inherit;
 font-family:inherit;cursor:pointer;line-height:1.45;transition:transform .15s,filter .15s;}
.cw-s:hover{transform:translateX(2px);filter:brightness(0.97);}
.cw-s span{flex:1;}
.cw-lbl{font-size:0.66rem;letter-spacing:0.08em;text-transform:uppercase;opacity:0.45;margin-bottom:10px;}
.cw-m{margin-bottom:15px;font-size:0.86rem;line-height:1.68;}
.cw-m:last-child{margin-bottom:0;}
.cw-q{background:rgba(15,110,86,0.07);border-radius:9px;padding:9px 12px;font-size:0.82rem;
 margin-bottom:11px;}
.cw-m a{color:#0f6e56;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(15,110,86,0.3);}
.cw-m a:hover{border-bottom-color:#0f6e56;}
@media(max-width:520px){#cw-panel{width:calc(100vw - 20px);bottom:10px;right:10px;}
 #cw-btn{bottom:14px;right:14px;padding:12px 17px;}#cw-log{max-height:44vh;}}
</style>
<script>
(function(){
  var API='https://ikram-chat.mikram-nuaa.workers.dev';
  var Q=[['What research is there on ISO 14001?','#1baf7a','rgba(15,110,86,0.07)'],
         ['Which papers cover North Africa?','#378add','rgba(55,138,221,0.07)'],
         ['What datasets are available?','#d85a30','rgba(216,90,48,0.07)']];
  var hist=[],busy=false,started=false;
  var ic='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>';
  var r=document.getElementById('cw-root');
  r.innerHTML='<button id="cw-btn" aria-label="Open research assistant">'+ic+
   '<span>Ask about this research</span></button>'+
   '<div id="cw-panel" role="dialog" aria-label="Research assistant">'+
   '<div id="cw-head"><div id="cw-ico">'+ic+'</div><div style="flex:1;">'+
   '<div style="font-size:0.9rem;font-weight:600;line-height:1.3;">Research assistant</div>'+
   '<div style="font-size:0.72rem;opacity:0.78;margin-top:1px;">74 publications · datasets · profile</div>'+
   '</div><button id="cw-x" aria-label="Close" style="background:none;border:none;color:#fff;'+
   'cursor:pointer;font-size:1.2rem;opacity:0.7;line-height:1;">&times;</button></div>'+
   '<div id="cw-log"></div>'+
   '<div id="cw-foot"><input id="cw-in" placeholder="Ask a question" autocomplete="off" maxlength="500">'+
   '<button id="cw-send" aria-label="Send">&#8593;</button></div></div>';

  var btn=document.getElementById('cw-btn'),pan=document.getElementById('cw-panel'),
      log=document.getElementById('cw-log'),inp=document.getElementById('cw-in');

  function md(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
  }
  function add(role,text){
    var d=document.createElement('div');
    d.className='cw-m'+(role==='user'?' cw-q':'');
    d.innerHTML=md(text);
    log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }
  function intro(){
    log.innerHTML='<div class="cw-lbl">Try asking</div>';
    Q.forEach(function(q){
      var b=document.createElement('button'); b.className='cw-s';
      b.style.background=q[2]; b.style.borderLeft='3px solid '+q[1];
      b.innerHTML='<span>'+q[0]+'</span><span style="color:'+q[1]+';font-size:0.95rem;flex:0;">&#8594;</span>';
      b.onclick=function(){ send(q[0]); };
      log.appendChild(b);
    });
  }
  function send(text){
    if(busy||!text.trim())return;
    if(!started){ log.innerHTML=''; started=true; }
    busy=true; inp.value='';
    add('user',text);
    hist.push({role:'user',content:text});
    var w=add('assistant','<span style="opacity:.4">Thinking…</span>');
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:hist.slice(-8)})})
      .then(function(x){return x.json();})
      .then(function(d){
        var t=d.reply||'Something went wrong. Try again in a moment.';
        w.innerHTML=md(t); hist.push({role:'assistant',content:t});
        log.scrollTop=log.scrollHeight; busy=false; inp.focus();
      })
      .catch(function(){
        w.textContent='The assistant is unavailable right now.'; busy=false;
      });
  }
  btn.onclick=function(){ pan.classList.add('open'); btn.style.display='none';
    if(!started)intro(); setTimeout(function(){inp.focus();},140); };
  document.getElementById('cw-x').onclick=function(){
    pan.classList.remove('open'); btn.style.display='flex'; };
  document.getElementById('cw-send').onclick=function(){ send(inp.value); };
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter')send(inp.value); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&pan.classList.contains('open')){
      pan.classList.remove('open'); btn.style.display='flex'; } });
})();
</script>
