name: Refresh World Bank datasets

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: |
          python3 - <<'PYEOF'
          import json,os,time,sys
          from urllib.request import urlopen,Request

          A3=json.load(open('.github/iso.json'))
          FAILED=[]

          def wb(code,lo=1990,hi=2025):
              u=("https://api.worldbank.org/v2/country/all/indicator/"+code+
                 "?format=json&per_page=22000&date=%d:%d"%(lo,hi))
              js=None
              for a in range(4):
                  try:
                      js=json.loads(urlopen(Request(u,headers={"User-Agent":"site/1.0"}),
                                            timeout=240).read().decode())
                      break
                  except Exception as e:
                      time.sleep(4)
              if js is None or len(js)<2 or not js[1]:
                  print("   FETCH FAILED  %s"%code)
                  return {},{}
              out={}; nm={}
              for r in js[1]:
                  iso=A3.get((r.get("countryiso3code") or "").strip())
                  if not iso: continue
                  v=r.get("value"); y=r.get("date")
                  if v is None or y is None: continue
                  out.setdefault(iso,{})[y]=round(float(v),3)
                  nm[iso]=r["country"]["value"]
              return out,nm

          def existing_count(path):
              try:
                  return len(json.load(open(path)).get("countries",{}))
              except Exception:
                  return 0

          def build(name,path,spec,src,keep,derive=None,dp=2):
              print(name)
              NAME={}; M={}
              for key,code in spec:
                  d,nm=wb(code); M[key]=d; NAME.update(nm)
                  print("  %-8s %6d"%(key,sum(len(v) for v in d.values())))
              if derive: derive(M)
              rows={}
              for m,d in M.items():
                  for iso,ys in d.items():
                      t={y:round(v,dp) for y,v in ys.items() if y in keep}
                      if t: rows.setdefault(iso,{"n":NAME.get(iso,iso),"d":{}})["d"][m]=t
              rows={k:v for k,v in rows.items() if v["d"]}
              old=existing_count(path)
              if len(rows) < old*0.9:
                  print("  !! REFUSED  %s  new %d countries vs existing %d — file untouched"
                        %(path,len(rows),old))
                  FAILED.append(path)
                  return
              years=sorted({y for c in rows.values() for m in c["d"] for y in c["d"][m]})
              json.dump({"source":src,"years":years,"countries":rows},
                        open(path,"w"),separators=(",",":"))
              print("  -> %s  %d countries (was %d), %d years"%(path,len(rows),old,len(years)))

          K5=set(str(y) for y in range(1990,2026,5))
          KR=set(str(y) for y in range(2019,2026))

          build("economy","data/econ.json",
                [("gdppc","NY.GDP.PCAP.PP.CD"),("gdp","NY.GDP.MKTP.PP.CD"),
                 ("trade","NE.TRD.GNFS.ZS"),("infl","FP.CPI.TOTL.ZG"),
                 ("unemp","SL.UEM.TOTL.ZS")],
                "World Bank World Development Indicators, via Our World in Data",
                K5|KR)

          build("governance","data/wgi.json",
                [("ge","GOV_WGI_GE.EST"),("rq","GOV_WGI_RQ.EST"),("rl","GOV_WGI_RL.EST"),
                 ("cc","GOV_WGI_CC.EST"),("va","GOV_WGI_VA.EST"),("ps","GOV_WGI_PV.EST")],
                "Worldwide Governance Indicators, World Bank",
                set(str(y) for y in range(1996,2025,4))|{"2022","2023","2024"},dp=3)

          build("air quality","data/air.json",
                [("pm25","EN.ATM.PM25.MC.M3")],
                "World Bank World Development Indicators",
                K5|set(str(y) for y in range(2019,2024)))

          build("internet","data/internet.json",
                [("net","IT.NET.USER.ZS"),("mob","IT.CEL.SETS.P2"),("bb","IT.NET.BBND.P2")],
                "International Telecommunication Union and World Bank, via Our World in Data",
                set(str(y) for y in range(1995,2025,5))|set(str(y) for y in range(2019,2025)))

          def gap(M):
              g={}
              for iso in M.get("f",{}):
                  for y,fv in M["f"][iso].items():
                      mv=M.get("m",{}).get(iso,{}).get(y)
                      if mv is not None: g.setdefault(iso,{})[y]=round(mv-fv,2)
              M["gap"]=g

          build("women's employment","data/women.json",
                [("f","SL.TLF.CACT.FE.ZS"),("m","SL.TLF.CACT.MA.ZS"),
                 ("sh","SL.TLF.TOTL.FE.ZS"),("vul","SL.EMP.VULN.FE.ZS")],
                "International Labour Organization modelled estimates, via the World Bank",
                K5|set(str(y) for y in range(2021,2025)),derive=gap)

          if FAILED:
              print()
              print("Refused to overwrite: "+", ".join(FAILED))
              sys.exit(1)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/econ.json data/wgi.json data/air.json data/internet.json data/women.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Refresh World Bank datasets"
            git push
          fi
