name: Refresh Our World in Data datasets

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: |
          python3 - <<'PYEOF'
          import csv,io,json,os,time,sys
          from urllib.request import urlopen,Request

          A3=json.load(open('.github/iso.json'))
          FAILED=[]

          def grab(slug,col,lo=1960,hi=2027):
              u="https://ourworldindata.org/grapher/"+slug+".csv"
              txt=None
              for a in range(4):
                  try:
                      txt=urlopen(Request(u,headers={"User-Agent":"Mozilla/5.0 site/1.0"}),
                                  timeout=180).read().decode()
                      break
                  except Exception as e:
                      time.sleep(4)
              if txt is None or txt.lstrip().startswith('{'):
                  print("   FETCH FAILED  %s"%slug); return {},{}
              rd=csv.DictReader(io.StringIO(txt))
              if col not in (rd.fieldnames or []):
                  print("   BAD COLUMN    %s  wanted '%s', have %s"%(slug,col,rd.fieldnames))
                  return {},{}
              out={}; nm={}
              for r in rd:
                  iso=A3.get((r.get("Code") or "").strip())
                  if not iso: continue
                  y=(r.get("Year") or "").strip()
                  if not y.lstrip('-').isdigit(): continue
                  yi=int(y)
                  if yi<lo or yi>hi: continue
                  v=(r.get(col) or "").strip()
                  if not v: continue
                  try: v=float(v)
                  except: continue
                  out.setdefault(iso,{})[y]=v
                  nm[iso]=r["Entity"]
              print("   %-46s %6d"%(slug[:44],sum(len(x) for x in out.values())))
              return out,nm

          def existing_count(path):
              try:
                  d=json.load(open(path))
                  return len(d.get("countries",{}))
              except Exception:
                  return 0

          def build(name,path,spec,src,keep,dp=2,derive=None):
              print(name)
              NAME={}; M={}
              for key,slug,col in spec:
                  d,nm=grab(slug,col); M[key]=d; NAME.update(nm)
              if derive: derive(M)
              rows={}
              for m,d in M.items():
                  for iso,ys in d.items():
                      t={y:round(v,dp) for y,v in ys.items() if y in keep}
                      if t: rows.setdefault(iso,{"n":NAME.get(iso,iso),"d":{}})["d"][m]=t
              rows={k:v for k,v in rows.items() if v["d"]}
              old=existing_count(path)
              if len(rows) < old*0.9:
                  print("  !! REFUSED  %s  new %d countries vs existing %d — file untouched"
                        %(path,len(rows),old))
                  FAILED.append(path)
                  return
              years=sorted({y for c in rows.values() for m in c["d"] for y in c["d"][m]})
              json.dump({"source":src,"years":years,"countries":rows},
                        open(path,"w"),separators=(",",":"))
              print("  -> %s  %d countries (was %d), %d years"%(path,len(rows),old,len(years)))

          Y5=lambda a,b,s=5: set(str(y) for y in range(a,b,s))
          YR=lambda a,b: set(str(y) for y in range(a,b))

          build("coal","data/coal.json",
            [("t","energy-consumption-by-source-and-country","Coal"),
             ("p","per-capita-coal","Coal"),
             ("s","share-of-primary-energy-consumption-by-source","Coal")],
            "Energy Institute Statistical Review, via Our World in Data",
            Y5(1990,2027)|YR(2020,2027))

          def popshares(M):
              kid=M.pop("kid",{}); wrk=M.pop("wrk",{}); old=M.pop("old",{})
              M["u15"]={}; M["o65"]={}
              for iso in kid:
                  for y in kid[iso]:
                      t=kid[iso][y]+wrk.get(iso,{}).get(y,0)+old.get(iso,{}).get(y,0)
                      if t>0:
                          M["u15"].setdefault(iso,{})[y]=kid[iso][y]/t*100
                          if iso in old and y in old[iso]:
                              M["o65"].setdefault(iso,{})[y]=old[iso][y]/t*100

          build("population","data/population.json",
            [("pop","population","Population"),
             ("growth","population-growth-rates","Population growth rate"),
             ("median","median-age","Median age"),
             ("fert","children-per-woman-un","Fertility rate"),
             ("life","life-expectancy","Life expectancy"),
             ("urban","share-of-population-urban","Urban"),
             ("dens","population-density","Population density"),
             ("oldep","age-dependency-ratio-old",'Age dependency ratio, old (% of working-age population)'),
             ("sexb","sex-ratio-at-birth","Sex ratio at birth (male births per female births)"),
             ("kid","population-young-working-elderly-with-projections","Children (Under-15s)"),
             ("wrk","population-young-working-elderly-with-projections","Working-age adults (15-64 years)"),
             ("old","population-young-working-elderly-with-projections","Older people (65+ years)")],
            "UN World Population Prospects and World Bank, via Our World in Data",
            Y5(1960,2024)|YR(2020,2024),derive=popshares)

          build("energy mix","data/energy.json",
            [("coal","share-of-primary-energy-consumption-by-source","Coal"),
             ("oil","share-of-primary-energy-consumption-by-source","Oil"),
             ("gas","share-of-primary-energy-consumption-by-source","Gas"),
             ("hydro","share-of-primary-energy-consumption-by-source","Hydropower"),
             ("wind","share-of-primary-energy-consumption-by-source","Wind"),
             ("solar","share-of-primary-energy-consumption-by-source","Solar"),
             ("nuclear","share-of-primary-energy-consumption-by-source","Nuclear"),
             ("fossil","fossil-fuels-share-energy","Fossil fuels"),
             ("renew","renewable-share-energy","Renewables"),
             ("lowc","low-carbon-share-energy","Low-carbon energy")],
            "Energy Institute Statistical Review, via Our World in Data",
            Y5(1990,2027)|YR(2020,2027))

          build("electric vehicles","data/ev.json",
            [("share","electric-car-sales-share","Share of new cars that are electric"),
             ("stockshare","share-car-stocks-electric","Share of car stocks that are electric"),
             ("sales","electric-car-sales","Electric cars sold"),
             ("stock","electric-car-stocks","Electric car stocks")],
            "IEA Global EV Outlook, via Our World in Data",
            YR(2010,2028))

          build("AI research","data/aipub.json",
            [("total","annual-scholarly-publications-on-artificial-intelligence",
              "AI scholarly publications - Field: All"),
             ("pc","scholarly-publications-on-artificial-intelligence-per-million-people",
              "AI scholarly publications per million people - Field: All")],
            "Stanford AI Index Report, via Our World in Data",
            YR(2016,2027),dp=3)

          build("armed conflict","data/conflict.json",
            [("best","deaths-in-armed-conflicts","Best estimate"),
             ("low","deaths-in-armed-conflicts","Low estimate"),
             ("high","deaths-in-armed-conflicts","High estimate"),
             ("rate","death-rate-in-armed-conflicts",
              "Death rate in ongoing conflicts (best estimate) - Conflict type: all")],
            "Uppsala Conflict Data Program, via Our World in Data",
            Y5(1989,2026)|YR(2019,2026),dp=2)

          build("food security","data/foodsec.json",
            [("under","prevalence-of-undernourishment",
              "2.1.1 prevalence of undernourishment - Value (percent)"),
             ("insec","share-of-population-with-severe-food-insecurity",
              "Prevalence of severe food insecurity in the total population"),
             ("cost","cost-healthy-diet","Cost of a healthy diet"),
             ("kcal","food-supply-kcal","Daily calorie supply per person")],
            "FAO Suite of Food Security Indicators, via Our World in Data",
            Y5(2000,2026)|YR(2019,2026),dp=2)

          if FAILED:
              print()
              print("Refused to overwrite: "+", ".join(FAILED))
              sys.exit(1)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coal.json data/population.json data/energy.json data/ev.json data/aipub.json data/conflict.json data/foodsec.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Refresh OWID datasets"
            git pull --rebase --autostash
            git push
          fi
