name: Update SDG index data

on:
  schedule:
    - cron: '0 8 2 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDG Index scores
        run: |
          python3 - <<'PY'
          import json, os, sys, time, datetime
          import urllib.request, urllib.parse, urllib.error

          BASE = "https://datasource.kapsarc.org/api/explore/v2.1/catalog/datasets/global-sdg-index/records"

          NAME2ISO = {
            "Afghanistan":"004","Albania":"008","Algeria":"012","Angola":"024","Argentina":"032",
            "Armenia":"051","Australia":"036","Austria":"040","Azerbaijan":"031","Bahamas, The":"044",
            "Bahrain":"048","Bangladesh":"050","Barbados":"052","Belarus":"112","Belgium":"056",
            "Belize":"084","Benin":"204","Bhutan":"064","Bolivia":"068","Bosnia and Herzegovina":"070",
            "Botswana":"072","Brazil":"076","Brunei Darussalam":"096","Bulgaria":"100","Burkina Faso":"854",
            "Burundi":"108","Cabo Verde":"132","Cambodia":"116","Cameroon":"120","Canada":"124",
            "Central African Republic":"140","Chad":"148","Chile":"152","China":"156","Colombia":"170",
            "Comoros":"174","Congo, Dem. Rep.":"180","Congo, Rep.":"178","Costa Rica":"188",
            "Cote d'Ivoire":"384","Côte d'Ivoire":"384","Croatia":"191","Cuba":"192","Cyprus":"196",
            "Czechia":"203","Denmark":"208","Djibouti":"262","Dominican Republic":"214","Ecuador":"218",
            "Egypt, Arab Rep.":"818","El Salvador":"222","Equatorial Guinea":"226","Eritrea":"232",
            "Estonia":"233","Eswatini":"748","Ethiopia":"231","Fiji":"242","Finland":"246","France":"250",
            "Gabon":"266","Gambia, The":"270","Georgia":"268","Germany":"276","Ghana":"288","Greece":"300",
            "Guatemala":"320","Guinea":"324","Guinea-Bissau":"624","Guyana":"328","Haiti":"332",
            "Honduras":"340","Hungary":"348","Iceland":"352","India":"356","Indonesia":"360",
            "Iran, Islamic Rep.":"364","Iraq":"368","Ireland":"372","Israel":"376","Italy":"380",
            "Jamaica":"388","Japan":"392","Jordan":"400","Kazakhstan":"398","Kenya":"404","Kiribati":"296",
            "Korea, Dem. Rep.":"408","Korea, Rep.":"410","Kuwait":"414","Kyrgyz Republic":"417",
            "Lao PDR":"418","Latvia":"428","Lebanon":"422","Lesotho":"426","Liberia":"430","Libya":"434",
            "Lithuania":"440","Luxembourg":"442","Madagascar":"450","Malawi":"454","Malaysia":"458",
            "Maldives":"462","Mali":"466","Malta":"470","Mauritania":"478","Mauritius":"480","Mexico":"484",
            "Moldova":"498","Mongolia":"496","Montenegro":"499","Morocco":"504","Mozambique":"508",
            "Myanmar":"104","Namibia":"516","Nepal":"524","Netherlands":"528","New Zealand":"554",
            "Nicaragua":"558","Niger":"562","Nigeria":"566","North Macedonia":"807","Norway":"578",
            "Oman":"512","Pakistan":"586","Panama":"591","Papua New Guinea":"598","Paraguay":"600",
            "Peru":"604","Philippines":"608","Poland":"616","Portugal":"620","Qatar":"634","Romania":"642",
            "Russian Federation":"643","Rwanda":"646","Samoa":"882","Sao Tome and Principe":"678",
            "Saudi Arabia":"682","Senegal":"686","Serbia":"688","Seychelles":"690","Sierra Leone":"694",
            "Singapore":"702","Slovak Republic":"703","Slovenia":"705","Solomon Islands":"090",
            "Somalia":"706","South Africa":"710","South Sudan":"728","Spain":"724","Sri Lanka":"144",
            "Sudan":"729","Suriname":"740","Sweden":"752","Switzerland":"756","Syrian Arab Republic":"760",
            "Tajikistan":"762","Tanzania":"834","Thailand":"764","Timor-Leste":"626","Togo":"768",
            "Tonga":"776","Trinidad and Tobago":"780","Tunisia":"788","Turkiye":"792","Türkiye":"792",
            "Turkmenistan":"795","Uganda":"800","Ukraine":"804","United Arab Emirates":"784",
            "United Kingdom":"826","United States":"840","Uruguay":"858","Uzbekistan":"860","Vanuatu":"548",
            "Venezuela, RB":"862","Vietnam":"704","Viet Nam":"704","Yemen, Rep.":"887","Zambia":"894",
            "Zimbabwe":"716",
          }

          def fetch(where, offset=0, limit=100):
              q = urllib.parse.urlencode({"where": where, "limit": limit, "offset": offset})
              try:
                  with urllib.request.urlopen(f"{BASE}?{q}", timeout=45) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  print("fetch failed:", e)
                  return None

          # find the most recent edition present in the data
          probe = fetch('indicator like "SDG Index Score"')
          if not probe or not probe.get("results"):
              print("no score records returned; leaving file unchanged"); sys.exit(0)
          edition = max(int(r["indicator"].split()[0]) for r in probe["results"]
                        if r["indicator"].split()[0].isdigit())
          print("edition:", edition)

          score_ind = f"{edition} SDG Index Score"
          rank_ind  = f"{edition} SDG Index Rank"

          def collect(indicator):
              out, offset = {}, 0
              while True:
                  d = fetch(f'indicator="{indicator}"', offset)
                  if not d or not d.get("results"): break
                  for r in d["results"]:
                      if r.get("value") is not None:
                          out[r["country"]] = (r["value"], r.get("indexreg"))
                  offset += 100
                  if offset >= d.get("total_count", 0): break
                  time.sleep(0.3)
              return out

          scores = collect(score_ind)
          ranks  = collect(rank_ind)
          print(f"scores: {len(scores)}  ranks: {len(ranks)}")

          if len(scores) < 100:
              print("too few scores; leaving file unchanged"); sys.exit(0)

          countries, unmatched = [], []
          for name, (val, region) in scores.items():
              iso = NAME2ISO.get(name)
              if not iso:
                  unmatched.append(name); continue
              countries.append({
                  "name": name, "iso": iso, "region": region,
                  "score": round(val, 1),
                  "rank": int(ranks[name][0]) if name in ranks else None,
              })
          if unmatched:
              print("unmatched country names:", ", ".join(sorted(unmatched)))

          countries.sort(key=lambda c: -c["score"])

          out = {
              "edition": edition,
              "updated": datetime.date.today().isoformat(),
              "countries": countries,
              "source": "Sustainable Development Report, SDSN",
          }
          os.makedirs("data", exist_ok=True)
          with open("data/sdg.json", "w") as f:
              json.dump(out, f, indent=2)
          print(f"wrote {len(countries)} countries")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sdg.json
          git diff --staged --quiet || git commit -m "Update SDG index data"
          git push
