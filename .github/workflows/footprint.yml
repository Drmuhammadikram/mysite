name: Update footprint data

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch African footprint data
        env:
          FOOTPRINT_KEY: ${{ secrets.FOOTPRINT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, base64, datetime, time
          import urllib.request, urllib.error

          KEY = os.environ["FOOTPRINT_KEY"]
          BASE = "https://api.footprintnetwork.org/v1"
          AUTH = base64.b64encode(f"user:{KEY}".encode()).decode()
          HEAD = {"Accept": "application/json", "Authorization": f"Basic {AUTH}"}

          # api code -> (display name, ISO-3166-1 numeric, used to join the map)
          AFRICA = {
              "7":("Angola","024"), "20":("Botswana","072"), "29":("Burundi","108"),
              "32":("Cameroon","120"), "37":("Central African Republic","140"),
              "39":("Chad","148"), "46":("Congo","178"), "53":("Benin","204"),
              "59":("Egypt","818"), "81":("Ghana","288"), "90":("Guinea","324"),
              "107":("Côte d'Ivoire","384"), "114":("Kenya","404"),
              "123":("Liberia","430"), "129":("Madagascar","450"),
              "130":("Malawi","454"), "133":("Mali","466"), "137":("Mauritius","480"),
              "144":("Mozambique","508"), "158":("Niger","562"), "159":("Nigeria","566"),
              "178":("Eritrea","232"), "181":("Zimbabwe","716"), "184":("Rwanda","646"),
              "195":("Senegal","686"), "197":("Sierra Leone","694"),
              "201":("Somalia","706"), "202":("South Africa","710"),
              "209":("Eswatini","748"), "215":("Tanzania","834"), "217":("Togo","768"),
              "222":("Tunisia","788"), "226":("Uganda","800"),
              "233":("Burkina Faso","854"), "238":("Ethiopia","231"),
              "250":("DR Congo","180"), "251":("Zambia","894"), "276":("Sudan","729"),
          }
          AGGREGATES = {"2000":"Africa","1011":"Northern Africa","5001":"World"}

          def get(path, tries=3):
              for n in range(tries):
                  try:
                      req = urllib.request.Request(f"{BASE}{path}", headers=HEAD)
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503):
                          time.sleep(4 * (n + 1)); continue
                      return None
                  except Exception:
                      time.sleep(3); continue
              return None

          years = get("/years")
          if not years:
              print("could not fetch years; leaving file unchanged")
              sys.exit(0)
          year = max(int(y["year"]) for y in years)
          print("latest year:", year)

          def extract(rows):
              if not rows:
                  return None
              ef = bc = pop = ef_tot = bc_tot = None
              for r in rows:
                  rec = r.get("record")
                  val = r.get("value")
                  if val is None:
                      continue
                  if rec == "EFConsPerCap":
                      ef = round(float(val), 2)
                  elif rec == "BiocapPerCap":
                      bc = round(float(val), 2)
                  elif rec == "EFConsTotGHA":
                      ef_tot = round(float(val))
                  elif rec == "BiocapTotGHA":
                      bc_tot = round(float(val))
                  elif rec == "Population":
                      pop = float(val)
              if ef is None or bc is None:
                  return None
              return {"ef": ef, "bc": bc, "deficit": round(bc - ef, 2),
                      "ef_total": ef_tot, "bc_total": bc_tot, "population": pop}

          countries = []
          for code, (name, iso) in AFRICA.items():
              d = extract(get(f"/data/{code}/{year}/all"))
              if d:
                  d["name"] = name
                  d["iso"] = iso
                  countries.append(d)
                  print(f"  {name}: EF {d['ef']}  BC {d['bc']}")
              time.sleep(0.35)

          if len(countries) < 10:
              print("too few countries returned; leaving file unchanged")
              sys.exit(0)

          aggregates = {}
          for code, name in AGGREGATES.items():
              d = extract(get(f"/data/{code}/{year}/all"))
              if d:
                  aggregates[name] = d
              time.sleep(0.35)

          countries.sort(key=lambda c: c["deficit"])

          out = {
              "year": year,
              "updated": datetime.date.today().isoformat(),
              "countries": countries,
              "aggregates": aggregates,
              "source": "Global Footprint Network National Footprint and Biocapacity Accounts",
          }

          os.makedirs("data", exist_ok=True)
          with open("data/footprint.json", "w") as f:
              json.dump(out, f, indent=2)
          print(f"wrote {len(countries)} countries for {year}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/footprint.json
          git diff --staged --quiet || git commit -m "Update footprint data"
          git push
