name: Update footprint data

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch world footprint data
        env:
          FOOTPRINT_KEY: ${{ secrets.FOOTPRINT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, base64, datetime, time
          import urllib.request, urllib.error

          KEY = os.environ["FOOTPRINT_KEY"]
          BASE = "https://api.footprintnetwork.org/v1"
          AUTH = base64.b64encode(f"user:{KEY}".encode()).decode()
          HEAD = {"Accept": "application/json", "Authorization": f"Basic {AUTH}"}

          ISO2N = {"AE":"784","AF":"004","AG":"028","AL":"008","AM":"051","AO":"024","AR":"032","AT":"040",
              "AU":"036","AZ":"031","BA":"070","BB":"052","BD":"050","BE":"056","BF":"854","BG":"100",
              "BH":"048","BI":"108","BJ":"204","BM":"060","BN":"096","BO":"068","BR":"076","BS":"044",
              "BT":"064","BW":"072","BY":"112","BZ":"084","CA":"124","CD":"180","CF":"140","CG":"178",
              "CH":"756","CI":"384","CL":"152","CM":"120","CN":"156","CO":"170","CR":"188","CU":"192",
              "CV":"132","CY":"196","CZ":"203","DE":"276","DJ":"262","DK":"208","DM":"212","DO":"214",
              "DZ":"012","EC":"218","EE":"233","EG":"818","ER":"232","ES":"724","ET":"231","FI":"246",
              "FJ":"242","FR":"250","GA":"266","GB":"826","GD":"308","GE":"268","GH":"288","GL":"304",
              "GM":"270","GN":"324","GQ":"226","GR":"300","GT":"320","GW":"624","GY":"328","HK":"344",
              "HN":"340","HR":"191","HT":"332","HU":"348","ID":"360","IE":"372","IL":"376","IN":"356",
              "IQ":"368","IR":"364","IS":"352","IT":"380","JM":"388","JO":"400","JP":"392","KE":"404",
              "KG":"417","KH":"116","KI":"296","KM":"174","KP":"408","KR":"410","KW":"414","KZ":"398",
              "LA":"418","LB":"422","LC":"662","LK":"144","LR":"430","LS":"426","LT":"440","LU":"442",
              "LV":"428","LY":"434","MA":"504","MD":"498","ME":"499","MG":"450","MK":"807","ML":"466",
              "MM":"104","MN":"496","MO":"446","MR":"478","MT":"470","MU":"480","MV":"462","MW":"454",
              "MX":"484","MY":"458","MZ":"508","NA":"516","NE":"562","NG":"566","NI":"558","NL":"528",
              "NO":"578","NP":"524","NZ":"554","OM":"512","PA":"591","PE":"604","PG":"598","PH":"608",
              "PK":"586","PL":"616","PR":"630","PS":"275","PT":"620","PY":"600","QA":"634","RO":"642",
              "RS":"688","RU":"643","RW":"646","SA":"682","SB":"090","SC":"690","SD":"729","SE":"752",
              "SG":"702","SI":"705","SK":"703","SL":"694","SN":"686","SO":"706","SR":"740","SS":"728",
              "ST":"678","SV":"222","SY":"760","SZ":"748","TD":"148","TG":"768","TH":"764","TJ":"762",
              "TL":"626","TM":"795","TN":"788","TO":"776","TR":"792","TT":"780","TZ":"834","UA":"804",
              "UG":"800","US":"840","UY":"858","UZ":"860","VE":"862","VN":"704","VU":"548","WS":"882",
              "YE":"887","ZA":"710","ZM":"894","ZW":"716"}

          AGGREGATES = {"5001":"World","2000":"Africa","2001":"Asia","2002":"Europe",
                        "2003":"Latin America and the Caribbean","2004":"North America","2005":"Oceania"}

          def get(path, tries=3):
              for n in range(tries):
                  try:
                      req = urllib.request.Request(f"{BASE}{path}", headers=HEAD)
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503):
                          time.sleep(4 * (n + 1)); continue
                      return None
                  except Exception:
                      time.sleep(3); continue
              return None

          years = get("/years")
          if not years:
              print("could not fetch years; leaving file unchanged"); sys.exit(0)
          year = max(int(y["year"]) for y in years)
          print("latest year:", year)

          all_countries = get("/countries")
          if not all_countries:
              print("could not fetch country list; leaving file unchanged"); sys.exit(0)

          targets = []
          for c in all_countries:
              iso2 = (c.get("isoa2") or "").strip().upper()
              code = str(c.get("countryCode"))
              name = c.get("shortName") or c.get("countryName")
              if iso2 and iso2 in ISO2N and not code.startswith(("1","2","5")):
                  targets.append((code, name, ISO2N[iso2]))
              elif iso2 and iso2 in ISO2N and len(code) < 4:
                  targets.append((code, name, ISO2N[iso2]))
          print("countries to fetch:", len(targets))

          def extract(rows):
              if not rows: return None
              ef = bc = pop = ef_tot = bc_tot = None
              for r in rows:
                  rec, val = r.get("record"), r.get("value")
                  if val is None: continue
                  if rec == "EFConsPerCap": ef = round(float(val), 2)
                  elif rec == "BiocapPerCap": bc = round(float(val), 2)
                  elif rec == "EFConsTotGHA": ef_tot = round(float(val))
                  elif rec == "BiocapTotGHA": bc_tot = round(float(val))
                  elif rec == "Population": pop = float(val)
              if ef is None or bc is None: return None
              return {"ef": ef, "bc": bc, "deficit": round(bc - ef, 2),
                      "ef_total": ef_tot, "bc_total": bc_tot, "population": pop}

          countries = []
          for i, (code, name, iso) in enumerate(targets):
              d = extract(get(f"/data/{code}/{year}/all"))
              if d:
                  d["name"] = name; d["iso"] = iso
                  countries.append(d)
              if i % 25 == 0:
                  print(f"  {i}/{len(targets)} ...")
              time.sleep(0.3)

          if len(countries) < 50:
              print(f"only {len(countries)} countries returned; leaving file unchanged"); sys.exit(0)

          aggregates = {}
          for code, name in AGGREGATES.items():
              d = extract(get(f"/data/{code}/{year}/all"))
              if d: aggregates[name] = d
              time.sleep(0.3)

          countries.sort(key=lambda c: c["deficit"])

          out = {"year": year, "updated": datetime.date.today().isoformat(),
                 "countries": countries, "aggregates": aggregates,
                 "source": "Global Footprint Network National Footprint and Biocapacity Accounts"}

          os.makedirs("data", exist_ok=True)
          with open("data/footprint.json", "w") as f:
              json.dump(out, f, indent=2)
          print(f"wrote {len(countries)} countries for {year}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/footprint.json
          git diff --staged --quiet || git commit -m "Update footprint data"
          git push
